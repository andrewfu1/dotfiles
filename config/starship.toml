"$schema" = 'https://starship.rs/config-schema.json'
# Pure-inspired layout, with only the information we use.
format = '$username$hostname$directory$git_branch$cmd_duration$line_break$character'
add_newline = true
palette = 'catppuccin_mocha'

[username]
show_always = false
format = '[$user@]($style)'
style_user = 'lavender'
style_root = 'red'

[hostname]
ssh_only = true
format = '[$hostname]($style) '
style = 'lavender'

[directory]
style = 'blue'
format = '[$path]($style)[$read_only]($read_only_style) '
truncation_length = 3
truncate_to_repo = false
read_only = ' (read-only)'
read_only_style = 'red'

[git_branch]
format = '[$branch]($style) '
style = 'overlay1'

[cmd_duration]
min_time = 10000
format = '[$duration]($style) '
style = 'yellow'

[character]
success_symbol = '[❯](green)'
error_symbol = '[❯](red)'
vimcmd_symbol = '[❮](mauve)'

[palettes.catppuccin_mocha]
blue = '#89b4fa'
lavender = '#b4befe'
overlay1 = '#7f849c'
yellow = '#f9e2af'
green = '#a6e3a1'
red = '#f38ba8'
mauve = '#cba6f7'
